name: ci
on:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/custom-agent@v2
        with:
          egress-policy: audit
          allowed-endpoints: >
            github.com:443

      # changed-files works checkout-less only on pull_request (GitHub API mode).
      # On push it diffs before..after in the local repo and errors without a
      # checkout, so this step must not be dropped.
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.SHA }}

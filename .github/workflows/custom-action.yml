name: test-custom-action-three-jobs
on:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/custom-agent@v3
        with:
          egress-policy: audit
          allowed-endpoints: >
            github.com:443

      - uses: actions/checkout@v3
      - run: echo "build"

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/custom-agent@v2
        with:
          egress-policy: audit
          allowed-endpoints: >
            github.com:443

      - uses: actions/checkout@v3
      - run: echo "lint"

  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/custom-agent@v2
        with:
          egress-policy: audit
          allowed-endpoints: >
            github.com:443

      - uses: actions/checkout@v3
